<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marlift Service OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Dashboard / Calendário -->
        <section id="tab-calendario" class="tab active">
            <h2>Calendário de OS</h2>
            <div id="calendario"></div>
        </section>
        
        <!-- Nova OS / Edição -->
        <section id="tab-os" class="tab">
            <h2 id="titulo-os">Nova Ordem de Serviço</h2>
            <select id="select-cliente" onchange="carregarEquipamentos()"></select>
            <select id="select-equipamento"></select>
            <textarea id="triagem" placeholder="Dados da triagem..."></textarea>
            <button onclick="iniciarOS()">Iniciar Atendimento / Salvar</button>
        </section>

        <!-- Campo de Assinatura Paisagem -->
        <div id="assinatura-container" style="display:none;">
            <canvas id="sigCanvas" width="500" height="200" style="border:1px solid #000;"></canvas>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
