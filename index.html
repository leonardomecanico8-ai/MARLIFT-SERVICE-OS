<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Marlift OS">
    <meta name="theme-color" content="#2b2b2b">
    <title>MARLIFT SERVICE - Sistema OS</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <header class="header">
        <div class="header-top">
            <div class="logo">
                <div class="logo-icon"><i class="fa-solid fa-wrench"></i></div>
                <div class="logo-text">
                    <h1>MARLIFT SERVICE</h1>
                    <span>Manutenção de Empilhadeiras</span>
                </div>
            </div>
            <button class="btn-header" onclick="novaOS()"><i class="fa-solid fa-plus"></i> Nova OS</button>
        </div>
        <div class="nav-tabs" id="navTabs">
            <div class="nav-tab active" data-tab="tab-dash" onclick="switchTab('tab-dash')"><i class="fa-solid fa-chart-line"></i> Dashboard</div>
            <div class="nav-tab" data-tab="tab-os" onclick="switchTab('tab-os')"><i class="fa-solid fa-file-pen"></i> OS</div>
            <div class="nav-tab" data-tab="tab-agenda" onclick="switchTab('tab-agenda')"><i class="fa-solid fa-calendar-days"></i> Agenda</div>
            <div class="nav-tab" data-tab="tab-hist" onclick="switchTab('tab-hist')"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</div>
            <div class="nav-tab" data-tab="tab-cfg" onclick="switchTab('tab-cfg')"><i class="fa-solid fa-gear"></i> Config</div>
        </div>
    </header>

    <div id="tab-os" class="tab-content">
        <div class="os-num-box">
            <div>
                <div class="os-num-label">Ordem de Serviço</div>
                <div class="os-num-value" id="osNum">#000001</div>
            </div>
        </div>

        <div class="card" id="cardTempoManual">
            <div class="card-header">
                <div class="card-icon"><i class="fa-solid fa-clock"></i></div>
                <div>
                    <div class="card-title">Controle de Horário</div>
                    <div class="card-subtitle">Preenchimento manual do atendimento</div>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="form-group" style="flex:1">
                        <label class="form-label">Início</label>
                        <input type="time" id="timeInicio" class="form-control" oninput="autoSave()">
                    </div>
                    <div class="form-group" style="flex:1">
                        <label class="form-label">Pausa</label>
                        <input type="time" id="timePausa" class="form-control" oninput="autoSave()">
                    </div>
                    <div class="form-group" style="flex:1">
                        <label class="form-label">Fim</label>
                        <input type="time" id="timeFim" class="form-control" oninput="autoSave()">
                    </div>
                </div>
            </div>
        </div>

        </div>

    <div id="tab-dash" class="tab-content active"></div>
    <div id="tab-agenda" class="tab-content"></div>
    <div id="tab-hist" class="tab-content"></div>
    <div id="tab-cfg" class="tab-content"></div>

    <script src="./script.js"></script>
</body>
</html>
